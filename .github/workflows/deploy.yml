name: Publicar no GitHub Pages

# Publica automaticamente a cada push na branch principal.
# O botão "Run workflow" permite republicar manualmente sem novo commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissões mínimas para o Pages funcionar.
permissions:
  contents: read
  pages: write
  id-token: write

# Se você fizer dois pushes seguidos, o deploy antigo é cancelado e vale o novo.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Construir o site
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Construir
        # As três variáveis vêm dos Secrets do repositório (Settings ->
        # Secrets and variables -> Actions). Se não estiverem configuradas, o
        # site ainda é publicado, mas abre em modo local (sem sincronização).
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_APP_EMAIL: ${{ secrets.VITE_APP_EMAIL }}
        run: npm run build

      - name: Configurar o Pages
        uses: actions/configure-pages@v5

      - name: Enviar os arquivos construídos
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
